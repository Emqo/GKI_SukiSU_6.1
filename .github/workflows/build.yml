name: 构建内核 (SukiSU Ultra / android14-6.1.138)

# 个人专用构建：SukiSU Ultra + GKI android14-6.1.138（2025-06 安全补丁）。
# 想换内核版本，只改下面 env 里的四行。
# 手动触发见下方 inputs；auto-trigger.yml 检测到上游更新时会用默认参数触发本工作流。

permissions:
  contents: write
  actions: write

concurrency:
  group: build-kernel
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      use_susfs:
        description: "启用 SUSFS"
        required: true
        type: boolean
        default: true
      use_kpm:
        description: "启用 KPM"
        required: true
        type: boolean
        default: true
      use_zram:
        description: "启用 ZRAM 增强算法 (lz4k / lz4kd)"
        required: true
        type: boolean
        default: true
      use_bbg:
        description: "启用 BBG 防格机 (Baseband-guard)"
        required: true
        type: boolean
        default: true
      cve_2026_43499_patch:
        description: "应用 CVE-2026-43499 rtmutex 修复链"
        required: true
        type: boolean
        default: true
      release:
        description: "构建成功后发布 GitHub Release"
        required: true
        type: boolean
        default: true
      version:
        description: "自定义版本名 (可选)"
        required: false
        type: string
      build_time:
        description: "自定义构建时间 (可选，N或留空=当前UTC)"
        required: false
        type: string
        default: "Sun Dec 01 08:10:00 UTC 2024"

env:
  ANDROID_VERSION: android14
  KERNEL_VERSION: "6.1"
  SUB_LEVEL: "138"
  OS_PATCH_LEVEL: "2025-06"
  KSU_VARIANT: SukiSU

jobs:
  # 下载最新的 SukiSU 管理器 APK 和 SUSFS 模块，同时给出版本号
  get-manager:
    uses: ./.github/workflows/get-manager.yml
    secrets: inherit
    with:
      use_susfs: ${{ inputs.use_susfs }}

  build:
    name: "android14-6.1.138-2025-06-SukiSU"
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      ksu_commit: ${{ steps.ksu.outputs.commit }}
      susfs_repo: ${{ steps.susfs.outputs.repo }}
      susfs_commit: ${{ steps.susfs.outputs.commit }}
      actual_sublevel: ${{ steps.sublevel.outputs.actual }}

    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: 构建信息摘要
        run: |
          echo "========================================"
          echo "       内核构建配置摘要"
          echo "========================================"
          echo "Android 版本  : $ANDROID_VERSION"
          echo "内核版本      : $KERNEL_VERSION"
          echo "子版本号      : $SUB_LEVEL"
          echo "补丁级别      : $OS_PATCH_LEVEL"
          echo "KSU 变体      : $KSU_VARIANT"
          echo "构建时间      : ${{ inputs.build_time }}"
          echo "SUSFS         : ${{ inputs.use_susfs }}"
          echo "KPM           : ${{ inputs.use_kpm }}"
          echo "ZRAM 增强     : ${{ inputs.use_zram }}"
          echo "BBG 补丁      : ${{ inputs.use_bbg }}"
          echo "CVE-2026-43499: ${{ inputs.cve_2026_43499_patch }}"
          echo "发布 Release  : ${{ inputs.release }}"
          echo "Stock Config  : config/stock_${KERNEL_VERSION}.config"
          echo "========================================"

      - name: 清理磁盘空间
        run: |
          # 先并行 mv 到临时目录（瞬时完成），再在后台低优先级删除，不阻塞后续步骤
          # 临时目录必须放在工作区之外：checkout 会以 runner 用户清空工作区，
          # 遇到 sudo mv 进来的 root 属主文件会 EACCES 失败
          TRASH_DIR=/tmp/.background_trash
          sudo rm -rf "$TRASH_DIR"
          mkdir -p "$TRASH_DIR"/{1..17}

          safe_mv() {
            [ -e "$1" ] && sudo mv "$1" "$2" || true
          }
          export -f safe_mv

          safe_mv /usr/share/dotnet         "$TRASH_DIR"/1  &
          safe_mv /usr/local/lib/android    "$TRASH_DIR"/2  &
          safe_mv /opt/ghc                  "$TRASH_DIR"/3  &
          safe_mv /opt/hostedtoolcache/CodeQL "$TRASH_DIR"/4 &
          safe_mv /usr/local/aws-sam-cli    "$TRASH_DIR"/5  &
          safe_mv /usr/local/share/chromium "$TRASH_DIR"/6  &
          safe_mv /usr/local/share/powershell "$TRASH_DIR"/7 &
          safe_mv /usr/local/lib/heroku     "$TRASH_DIR"/8  &
          safe_mv /usr/local/lib/node_modules "$TRASH_DIR"/9 &
          safe_mv /opt/az                   "$TRASH_DIR"/10 &
          safe_mv /opt/microsoft/powershell "$TRASH_DIR"/11 &
          safe_mv /opt/hostedtoolcache/go   "$TRASH_DIR"/12 &
          safe_mv /opt/hostedtoolcache/PyPy "$TRASH_DIR"/13 &
          safe_mv /opt/hostedtoolcache/node "$TRASH_DIR"/14 &
          sudo bash -c "mv /usr/local/bin/aliyun /usr/local/bin/azcopy /usr/local/bin/bicep \
            /usr/local/bin/cmake-gui /usr/local/bin/cpack /usr/local/bin/helm \
            /usr/local/bin/hub /usr/local/bin/kubectl /usr/local/bin/minikube \
            /usr/local/bin/node /usr/local/bin/packer /usr/local/bin/sam \
            /usr/local/bin/stack /usr/local/bin/terraform /usr/local/bin/oc \
            $TRASH_DIR/15 2>/dev/null || true" &
          sudo bash -c "mv /usr/local/julia* $TRASH_DIR/16 2>/dev/null || true" &
          sudo bash -c "mv /usr/local/bin/pulumi* $TRASH_DIR/17 2>/dev/null || true" &
          wait

          # 后台低优先级删除，顺带清理浏览器包和 apt 缓存
          (
            sudo nice -n 19 ionice -c 3 rm -rf "$TRASH_DIR"
            sudo apt-get purge -y firefox google-chrome-stable microsoft-edge-stable \
              >/dev/null 2>&1 || true
            sudo apt-get autoremove -y >/dev/null 2>&1 || true
            sudo apt-get clean >/dev/null 2>&1 || true
            command -v docker >/dev/null 2>&1 && \
              docker rmi $(docker images -q) 2>/dev/null || true
          ) >/dev/null 2>&1 &
          disown

      - name: 检出代码仓库
        uses: actions/checkout@v7

      - name: 初始化构建环境
        run: |
          CONFIG="${ANDROID_VERSION}-${KERNEL_VERSION}-${SUB_LEVEL}"
          KERNEL_ROOT="$GITHUB_WORKSPACE/$CONFIG"
          mkdir -p "$KERNEL_ROOT"

          cat >> $GITHUB_ENV << EOF
          CONFIG=$CONFIG
          KERNEL_ROOT=$KERNEL_ROOT
          DEFCONFIG=$KERNEL_ROOT/common/arch/arm64/configs/gki_defconfig
          SUSFS4KSU=$GITHUB_WORKSPACE/susfs4ksu
          SUKISU_PATCHES=$GITHUB_WORKSPACE/SukiSU_patch
          LOCAL_PATCHES=$GITHUB_WORKSPACE
          ANYKERNEL3=$GITHUB_WORKSPACE/AnyKernel3
          ACTION_BUILD=$GITHUB_WORKSPACE/Action-Build
          AVBTOOL=$GITHUB_WORKSPACE/kernel-build-tools/linux-x86/bin/avbtool
          MKBOOTIMG=$GITHUB_WORKSPACE/mkbootimg/mkbootimg.py
          BOOT_SIGN_KEY_PATH=$GITHUB_WORKSPACE/kernel-build-tools/linux-x86/share/avb/testkey_rsa2048.pem
          EOF

          mkdir -p "$GITHUB_WORKSPACE/git-repo"
          # storage.googleapis.com 偶发 TLS 握手失败（curl 退出码 35）。
          # --retry-all-errors 才会重试握手类错误，
          # -f 保证 HTTP 错误页不会被当成成功写进 repo 文件。
          curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors --connect-timeout 30 \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$GITHUB_WORKSPACE/git-repo/repo"
          chmod 0755 "$GITHUB_WORKSPACE/git-repo/repo"
          echo "$GITHUB_WORKSPACE/git-repo" >> "$GITHUB_PATH"
          echo "REPO=$GITHUB_WORKSPACE/git-repo/repo" >> $GITHUB_ENV

      - name: 显示配置信息
        run: |
          CONFIG_FILE="$GITHUB_WORKSPACE/config/config"
          if [ -f "$CONFIG_FILE" ]; then
            echo "加载配置文件: $CONFIG_FILE"
            cat "$CONFIG_FILE"
          fi

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache python3 git curl build-essential libssl-dev bison flex libelf-dev dwarves

      - name: 配置 ccache
        run: |
          mkdir -p ~/.cache/bazel
          ccache --version
          ccache --max-size=2G
          ccache --set-config=compression=true
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

      - name: 恢复 ccache 缓存
        uses: actions/cache@v5
        with:
          path: ~/.ccache
          key: ${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}-${{ env.SUB_LEVEL }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}-${{ env.SUB_LEVEL }}-ccache-

      # 6.1 走 bazel 构建，持久化 --disk_cache 目录以加速后续构建
      - name: 恢复 bazel 磁盘缓存
        uses: actions/cache@v5
        with:
          path: ~/.cache/bazel
          key: ${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}-${{ env.SUB_LEVEL }}-bazel-${{ github.sha }}
          restore-keys: |
            ${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}-${{ env.SUB_LEVEL }}-bazel-
            ${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}-bazel-

      - name: 缓存工具链
        id: cache-toolchain
        uses: actions/cache@v5
        with:
          path: |
            kernel-build-tools
            mkbootimg
          key: toolchain-${{ runner.os }}-v1

      - name: 下载工具链
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          AOSP_MIRROR=https://android.googlesource.com
          BRANCH=main-kernel-build-2024
          git clone $AOSP_MIRROR/kernel/prebuilts/build-tools -b $BRANCH --depth 1 kernel-build-tools
          git clone $AOSP_MIRROR/platform/system/tools/mkbootimg -b $BRANCH --depth 1 mkbootimg

      - name: 生成签名密钥
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 > $BOOT_SIGN_KEY_PATH

      - name: 配置 Git
        run: |
          git config --global user.name "BuildBot"
          git config --global user.email "BuildGkiKernel@gmail.com"

      - name: 克隆依赖仓库
        run: |
          # 依赖克隆可能遇到瞬时网络错误；递增等待并随机错峰。
          # 每次克隆前清理目标目录，防止上次中断的残留使后续尝试必然失败。
          clone_with_retry() {
            local repository="$1" destination="$2"
            shift 2
            local attempt delay rc=1
            for attempt in 1 2 3 4 5; do
              echo "克隆 $repository（第 $attempt/5 次）..."
              rm -rf -- "$destination" || return 1
              if git clone "$repository" "$destination" "$@"; then
                return 0
              else
                rc=$?
              fi
              if [ "$attempt" -lt 5 ]; then
                delay=$((15 * (1 << (attempt - 1)) + RANDOM % 10))
                echo "::warning::克隆 $repository 失败（退出码 $rc），${delay} 秒后重试"
                sleep "$delay" || return 1
              fi
            done
            rm -rf -- "$destination" || return 1
            echo "克隆 $repository 失败，已用尽 5 次尝试（退出码 $rc）" >&2
            return "$rc"
          }

          echo "克隆 AnyKernel3..."
          clone_with_retry https://github.com/WildKernels/AnyKernel3.git AnyKernel3 -b gki-2.0
          rm -rf AnyKernel3/.git

          echo "准备补丁资源..."
          clone_with_retry https://github.com/ShirkNeko/SukiSU_patch.git SukiSU_patch
          clone_with_retry https://github.com/Numbersf/Action-Build.git Action-Build --depth=1

      - name: 初始化并同步内核源码
        working-directory: ${{ env.KERNEL_ROOT }}
        run: |
          FORMATTED_BRANCH="${ANDROID_VERSION}-${KERNEL_VERSION}-${OS_PATCH_LEVEL}"
          MAX_ATTEMPTS=3
          RETRY_DELAY=15
          SYNC_TIMEOUT=15m

          # android.googlesource.com 偶发限流、连接重置或单个 project 拉取卡死，
          # 单次失败不代表分支有问题，整轮重来通常就能成功。
          init_repo() {
            $REPO init --depth=1 -u https://android.googlesource.com/kernel/manifest \
              -b common-${FORMATTED_BRANCH} --repo-rev=v2.16 || return 1

            # ls-remote 同样可能瞬时失败；失败时返回空会让弃用分支判定出错，
            # 因此按退出码重试，全部失败就让本轮重来而不是白跑一次 sync。
            local ok=false
            for _ in 1 2 3; do
              if REMOTE_BRANCH=$(git ls-remote https://android.googlesource.com/kernel/common ${FORMATTED_BRANCH}); then
                ok=true
                break
              fi
              sleep 5
            done
            if [ "$ok" != true ]; then
              echo "git ls-remote 查询 ${FORMATTED_BRANCH} 失败"
              return 1
            fi

            DEFAULT_MANIFEST_PATH=.repo/manifests/default.xml
            TAG_FALLBACK=""
            if grep -q deprecated <<< "$REMOTE_BRANCH"; then
              echo "检测到已弃用的分支: $FORMATTED_BRANCH"
              sed -i "s/\"${FORMATTED_BRANCH}\"/\"deprecated\/${FORMATTED_BRANCH}\"/g" $DEFAULT_MANIFEST_PATH
            elif [ -z "$REMOTE_BRANCH" ]; then
              # Google 会把过期的月度分支整个删掉（既不在活跃也不在 deprecated/ 下），
              # 但 manifest 仍指向该分支。发布 tag 不会被删，回退到编号最大的 _rN tag。
              # 必须写成 refs/tags/ 全路径，裸 tag 名会被 repo 当成分支去 refs/heads/ 下找。
              local latest_tag
              latest_tag=$(git ls-remote https://android.googlesource.com/kernel/common "refs/tags/${FORMATTED_BRANCH}_r*" 2>/dev/null \
                | awk '{print $2}' | grep -v '\^{}$' | sed 's|refs/tags/||' \
                | awk -F'_r' '{print $NF+0, $0}' | sort -n | tail -n 1 | cut -d' ' -f2- || true)
              if [ -z "$latest_tag" ]; then
                echo "::error::分支 ${FORMATTED_BRANCH} 在上游既无分支也无发布 tag"
                return 1
              fi
              echo "分支 ${FORMATTED_BRANCH} 已被上游删除，回退到发布 tag: $latest_tag"
              sed -i "/path=\"common\"/ s|revision=\"${FORMATTED_BRANCH}\"|revision=\"refs/tags/${latest_tag}\"|" $DEFAULT_MANIFEST_PATH
              TAG_FALLBACK="$latest_tag"
            fi
          }

          attempt=1
          while :; do
            echo "第 $attempt/$MAX_ATTEMPTS 次初始化并同步，分支: common-${FORMATTED_BRANCH}（单次超时 $SYNC_TIMEOUT）"
            df -h "$PWD" | tail -n +2 || true

            rc=0
            if init_repo; then
              # 不加 --fail-fast：单个 project 出错时让其余 project 继续拉完，
              # 重试只需要补齐缺失部分。-j4 与 --no-clone-bundle 是为了避免
              # 高并发触发限流、以及跳过经常超时的 clone.bundle。
              SYNC_FLAGS="-c -j4 --jobs-checkout=4 --no-tags --no-clone-bundle --retry-fetches=3"
              # 第二次在原地续传（repo sync 可断点续传），第三次才整目录重来
              [ "$attempt" -gt 1 ] && SYNC_FLAGS="$SYNC_FLAGS --force-sync"
              timeout -k 60 "$SYNC_TIMEOUT" $REPO sync $SYNC_FLAGS || rc=$?
              if [ "$rc" -eq 0 ]; then
                echo "内核源码同步成功（第 $attempt 次）"
                break
              fi
              if [ "$rc" -eq 124 ]; then
                echo "repo sync 超时（$SYNC_TIMEOUT）"
              else
                echo "repo sync 失败，退出码 $rc"
              fi
            else
              rc=1
              echo "repo init 或分支预检失败"
            fi

            if [ "$attempt" -ge "$MAX_ATTEMPTS" ]; then
              echo "::error::内核源码同步连续 $MAX_ATTEMPTS 次失败"
              exit "$rc"
            fi

            # 最后一次重试前彻底清空：只删 .repo 会残留半检出的 project 目录，
            # 之后每次 sync 都会以 "Checking out local projects failed" 收场。
            if [ "$attempt" -eq $((MAX_ATTEMPTS - 1)) ]; then
              echo "清空工作目录后重来"
              find "$PWD" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
            fi

            echo "${RETRY_DELAY}s 后重试..."
            sleep "$RETRY_DELAY"
            attempt=$((attempt + 1))
          done

          echo "REMOTE_BRANCH=$REMOTE_BRANCH" >> $GITHUB_ENV
          echo "TAG_FALLBACK=$TAG_FALLBACK" >> $GITHUB_ENV

      - name: 应用 Stock Config 伪装
        run: |
          KVER="$KERNEL_VERSION"
          STOCK_DST="$KERNEL_ROOT/common/arch/arm64/configs/stock_defconfig"
          STOCK_SRC=""

          if [ -f "$GITHUB_WORKSPACE/config/stock_${KVER}.config" ]; then
            STOCK_SRC="$GITHUB_WORKSPACE/config/stock_${KVER}.config"
            echo "使用版本专用 stock config: $STOCK_SRC"
          else
            STOCK_URL="https://android.googlesource.com/kernel/prebuilts/${KVER}/arm64/+/refs/heads/main/kernel-${KVER}-gz?format=TEXT"
            TMP_IMG="$(mktemp)"
            echo "下载官方 GKI ${KVER} 预编译内核以提取库存配置: $STOCK_URL"
            if curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors --connect-timeout 30 \
                "$STOCK_URL" | base64 -d > "$TMP_IMG" && [ -s "$TMP_IMG" ]; then
              EXTRACT_SCRIPT="$KERNEL_ROOT/common/scripts/extract-ikconfig"
              [ -f "$EXTRACT_SCRIPT" ] || EXTRACT_SCRIPT="$KERNEL_ROOT/common/scripts/extract-ikconfig.sh"
              if [ -f "$EXTRACT_SCRIPT" ]; then
                if bash "$EXTRACT_SCRIPT" "$TMP_IMG" > "${TMP_IMG}.config" 2>/dev/null \
                    && [ -s "${TMP_IMG}.config" ] \
                    && grep -q '^CONFIG_' "${TMP_IMG}.config"; then
                  STOCK_SRC="${TMP_IMG}.config"
                  echo "已从官方预编译内核提取库存配置"
                fi
              else
                echo "::warning::未找到 extract-ikconfig，跳过提取"
              fi
            else
              echo "::warning::下载官方 GKI ${KVER} 预编译内核失败"
            fi
          fi

          if [ -z "$STOCK_SRC" ] || [ ! -f "$STOCK_SRC" ]; then
            echo "::warning title=Stock Config 伪装已跳过::无法获取库存配置，/proc/config.gz 将暴露真实构建配置"
            exit 0
          fi

          if grep -qE '^CONFIG_(KSU|KSU_SUSFS)' "$STOCK_SRC"; then
            echo "::error::库存配置包含 KSU/SUSFS 选项，伪装目的无法达成: $STOCK_SRC"
            exit 1
          fi

          mkdir -p "$(dirname "$STOCK_DST")"
          if ! cp "$STOCK_SRC" "$STOCK_DST"; then
            echo "::error::复制 stock_defconfig 失败: $STOCK_SRC -> $STOCK_DST"
            exit 1
          fi
          echo "已复制库存配置 -> $STOCK_DST ($(wc -l < "$STOCK_DST") 行)"

          NEW_RULE='$(obj)/config_data: arch/arm64/configs/stock_defconfig FORCE'
          OLD_RULE='$(obj)/config_data: $(KCONFIG_CONFIG) FORCE'
          TARGET_MAKEFILE="$KERNEL_ROOT/common/kernel/Makefile"

          if [ ! -f "$TARGET_MAKEFILE" ]; then
            echo "::error::未找到 $TARGET_MAKEFILE"
            exit 1
          fi

          if grep -qF "$NEW_RULE" "$TARGET_MAKEFILE"; then
            echo "config_data 规则已是 stock_defconfig，跳过。"
          elif grep -qF "$OLD_RULE" "$TARGET_MAKEFILE"; then
            sed -i 's|$(obj)/config_data: $(KCONFIG_CONFIG) FORCE|$(obj)/config_data: arch/arm64/configs/stock_defconfig FORCE|' "$TARGET_MAKEFILE"
            echo "已替换 config_data 规则: $TARGET_MAKEFILE"
          else
            echo "::error::未在 $TARGET_MAKEFILE 找到规则: $OLD_RULE"
            exit 1
          fi

      - name: 提取实际子版本号
        id: sublevel
        run: |
          ACTUAL_SUBLEVEL="$SUB_LEVEL"
          if [[ -f "$KERNEL_ROOT/common/Makefile" ]]; then
            EXTRACTED=$(grep '^SUBLEVEL = ' "$KERNEL_ROOT/common/Makefile" | awk '{print $3}')
            [[ -n "$EXTRACTED" ]] && ACTUAL_SUBLEVEL="$EXTRACTED"
          fi
          echo "ACTUAL_SUBLEVEL=$ACTUAL_SUBLEVEL" >> $GITHUB_ENV
          echo "actual=$ACTUAL_SUBLEVEL" >> $GITHUB_OUTPUT
          echo "实际子版本号: $ACTUAL_SUBLEVEL"
          if [ "$ACTUAL_SUBLEVEL" != "$SUB_LEVEL" ]; then
            echo "::warning::期望 6.1.$SUB_LEVEL，实际同步到 6.1.$ACTUAL_SUBLEVEL，请检查 OS_PATCH_LEVEL 与 SUB_LEVEL 是否对应"
          fi

      # 以同步后的实际 SUBLEVEL 判断，避免对已包含上游修复的 LTS 重复打补丁
      - name: 应用 CVE-2026-43499 rtmutex 修复链
        if: inputs.cve_2026_43499_patch
        working-directory: ${{ env.KERNEL_ROOT }}/common
        run: |
          bash "$GITHUB_WORKSPACE/security_patch/apply_cve_2026_43499.sh" \
            "$KERNEL_VERSION" \
            "$ACTUAL_SUBLEVEL" \
            "$GITHUB_WORKSPACE/security_patch"

      - name: 确定 SukiSU 分支
        env:
          USE_SUSFS: ${{ inputs.use_susfs }}
        run: |
          # 开启 SUSFS 用 builtin 分支（内置 SUSFS 支持），否则用 main
          if [ "$USE_SUSFS" = "true" ]; then
            BRANCH="-s builtin"
          else
            BRANCH="-s main"
          fi

          # config/config 里 custom=true 且填了 sukisu= 时，固定到指定提交
          CONFIG_FILE="config/config"
          if [ -f "$CONFIG_FILE" ]; then
            CUSTOM_ENABLED=$(grep "^custom=" "$CONFIG_FILE" | cut -d'=' -f2)
            if [ "$CUSTOM_ENABLED" == "true" ]; then
              SUKISU_COMMIT=$(grep "^sukisu=" "$CONFIG_FILE" | cut -d'=' -f2)
              if [ -n "$SUKISU_COMMIT" ]; then
                BRANCH="-s $SUKISU_COMMIT"
                echo "SukiSU 使用自定义提交: $SUKISU_COMMIT"
              fi
            fi
          fi

          echo "BRANCH=$BRANCH" >> $GITHUB_ENV
          echo "KSU 分支: $BRANCH"

      - name: 添加 SukiSU
        id: ksu
        working-directory: ${{ env.KERNEL_ROOT }}
        run: |
          echo "添加 SukiSU Ultra..."
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash $BRANCH

          if [ -d "KernelSU/.git" ]; then
            KSU_LATEST_COMMIT_DATE=$(git -C KernelSU log -1 --date=format:'%Y-%m-%d %H:%M:%S %z' --format='%cd')
            echo "KSU_LATEST_COMMIT_DATE=$KSU_LATEST_COMMIT_DATE" >> $GITHUB_ENV
            echo "commit=$(git -C KernelSU rev-parse HEAD)" >> $GITHUB_OUTPUT
          else
            echo "KSU_LATEST_COMMIT_DATE=未知" >> $GITHUB_ENV
            echo "commit=" >> $GITHUB_OUTPUT
          fi

      - name: 配置 SukiSU 管理器信息
        working-directory: ${{ env.KERNEL_ROOT }}/KernelSU
        env:
          CUSTOM_TAG: ${{ vars.MANAGER_STR }}
        run: |
          KBUILD_FILE="./kernel/Kbuild"

          if [ ! -f "$KBUILD_FILE" ]; then
            echo "未找到 $KBUILD_FILE，跳过 SukiSU 版本标识定制"
            exit 0
          fi

          GIT_HASH=$(git rev-parse --short=8 HEAD)
          BRANCH_NAME="${BRANCH#-s }"
          if [ -z "$BRANCH_NAME" ] || [ "$BRANCH_NAME" = "$BRANCH" ]; then
            BRANCH_NAME=$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo "main")
          fi

          if [ -n "$CUSTOM_TAG" ]; then
            VERSION_TEMPLATE="v\$1-${CUSTOM_TAG}@${BRANCH_NAME}[${GIT_HASH}]"
          else
            VERSION_TEMPLATE="v\$1-$GIT_HASH@$BRANCH_NAME"
          fi

          awk -v body="$VERSION_TEMPLATE" '
            BEGIN {
              in_block = 0
              replaced = 0
            }
            /^[[:space:]]*define get_ksu_version_full$/ {
              print
              print body
              in_block = 1
              replaced = 1
              next
            }
            in_block && /^[[:space:]]*endef$/ {
              print
              in_block = 0
              next
            }
            !in_block {
              print
            }
            END {
              if (!replaced) {
                exit 1
              }
            }
          ' "$KBUILD_FILE" > "${KBUILD_FILE}.tmp" && mv "${KBUILD_FILE}.tmp" "$KBUILD_FILE"

          echo "已更新 get_ksu_version_full 模板: $VERSION_TEMPLATE"

      # 在内核源码和 KSU 准备完成后再获取 SUSFS，避免在前期集中拉取。
      - name: 克隆 SUSFS 源码
        id: susfs
        if: inputs.use_susfs
        run: |
          set -euo pipefail

          # 最多尝试五次，两次尝试之间固定等待五秒。
          retry() {
            local attempt rc=1
            for attempt in 1 2 3 4 5; do
              echo "第 $attempt/5 次尝试: $*"
              if "$@"; then
                return 0
              else
                rc=$?
              fi
              if [ "$attempt" -lt 5 ]; then
                echo "::warning::命令失败（退出码 $rc），5 秒后重试: $*"
                sleep 5 || return 1
              fi
            done
            echo "命令失败，已用尽 5 次尝试（退出码 $rc）: $*" >&2
            return "$rc"
          }

          # 保留失败残留清理，防止重试被已有的半成品目录阻断。
          clone_susfs() {
            local rc
            rm -rf -- susfs4ksu || return 1
            if git clone "$1" -b "$SUSFS_BRANCH" susfs4ksu; then
              return 0
            else
              rc=$?
            fi
            rm -rf -- susfs4ksu || return 1
            return "$rc"
          }

          SUSFS_BRANCH="gki-${ANDROID_VERSION}-${KERNEL_VERSION}"

          echo "克隆 SUSFS (分支: $SUSFS_BRANCH)..."
          if ! retry clone_susfs https://github.com/ShirkNeko/susfs4ksu.git; then
            echo "::warning::ShirkNeko 仓库克隆失败（分支 $SUSFS_BRANCH），回退到 simonpunk 原版..."
            retry clone_susfs https://gitlab.com/simonpunk/susfs4ksu.git
          fi

          CONFIG_FILE="config/config"
          if [ -f "$CONFIG_FILE" ]; then
            CUSTOM_ENABLED=$(grep "^custom=" "$CONFIG_FILE" | cut -d'=' -f2 || true)
            if [ "$CUSTOM_ENABLED" == "true" ]; then
              CUSTOM_COMMIT=$(grep "^${SUSFS_BRANCH}=" "$CONFIG_FILE" | cut -d'=' -f2 || true)
              if [ -n "$CUSTOM_COMMIT" ]; then
                echo "切换 SUSFS 到自定义提交: $CUSTOM_COMMIT"
                retry git -C susfs4ksu checkout "$CUSTOM_COMMIT"
              fi
            fi
          fi

          SUSFS_COMMIT=$(git -C susfs4ksu rev-parse HEAD)
          echo "SUSFS 实际提交: $SUSFS_COMMIT"
          SUSFS_LATEST_COMMIT_DATE=$(git -C susfs4ksu log -1 --date=format:'%Y-%m-%d %H:%M:%S %z' --format='%cd')
          echo "SUSFS_LATEST_COMMIT_DATE=$SUSFS_LATEST_COMMIT_DATE" >> "$GITHUB_ENV"
          echo "SUSFS 仓库最新提交日期: $SUSFS_LATEST_COMMIT_DATE"
          echo "commit=$SUSFS_COMMIT" >> "$GITHUB_OUTPUT"
          echo "repo=$(git -C susfs4ksu remote get-url origin | sed 's/\.git$//')" >> "$GITHUB_OUTPUT"

      - name: 应用 SUSFS 补丁
        if: inputs.use_susfs
        working-directory: ${{ env.KERNEL_ROOT }}
        run: bash "$GITHUB_WORKSPACE/scripts/susfs_fixes/apply.sh"

      - name: 备份基准 defconfig
        run: cp "$DEFCONFIG" "$DEFCONFIG.orig"

      - name: 应用 Unicode 绕过修复
        if: inputs.use_susfs
        working-directory: ${{ env.KERNEL_ROOT }}/common
        run: |
          # 上游 2023-11、2024-01、2024-03 月度分支已带有 "unicode: Don't special case ignorable code points"，
          # patch --forward 会判定为已应用并跳过，但被忽略的 hunk 仍会写成 .rej，先做幂等检查
          if [ -f fs/unicode/mkutf8data.c ] && ! grep -q 'ignore_init' fs/unicode/mkutf8data.c; then
            echo "源码已包含 Unicode 绕过修复，跳过补丁"
            exit 0
          fi
          patch -p1 --forward < "$ACTION_BUILD/patches/unicode_bypass_fix_6.1+.patch" || true

      - name: 配置 ZRAM LZ4 补丁栈
        if: inputs.use_zram
        working-directory: ${{ env.KERNEL_ROOT }}/common
        run: |
          echo "升级 LZ4..."
          rm -f lib/lz4/lz4_compress.c lib/lz4/lz4_decompress.c lib/lz4/lz4defs.h lib/lz4/lz4hc_compress.c

          cp -r $LOCAL_PATCHES/zram/lz4/* ./lib/lz4/
          cp -r $LOCAL_PATCHES/zram/include/linux/* ./include/linux/
          bash $LOCAL_PATCHES/zram/apply_lz4_neon.sh

          if [ -f "fs/f2fs/Makefile" ] && ! grep -qF "f2fs-\$(CONFIG_F2FS_IOSTAT) += iostat.o" "fs/f2fs/Makefile"; then
            echo "f2fs-\$(CONFIG_F2FS_IOSTAT) += iostat.o" >> "fs/f2fs/Makefile"
          fi

          cp -r $SUKISU_PATCHES/other/zram/lz4k/include/linux/* ./include/linux/
          cp -r $SUKISU_PATCHES/other/zram/lz4k/lib/* ./lib/
          cp -r $SUKISU_PATCHES/other/zram/lz4k/crypto/* ./crypto/
          cp -r $SUKISU_PATCHES/other/zram/lz4k_oplus ./lib/

          cp $SUKISU_PATCHES/other/zram/zram_patch/${KERNEL_VERSION}/lz4kd.patch ./
          if ! patch -p1 -F 3 < lz4kd.patch; then
            echo "::warning::lz4kd.patch 应用失败，可能已应用或上下文不匹配"
          fi

          cp $SUKISU_PATCHES/other/zram/zram_patch/${KERNEL_VERSION}/lz4k_oplus.patch ./
          if ! patch -p1 -F 3 < lz4k_oplus.patch; then
            echo "::warning::lz4k_oplus.patch 应用失败，可能已应用或上下文不匹配"
          fi

      - name: 配置 ZRAM 选项
        if: inputs.use_zram
        run: |
          CONFIG_FILE="$DEFCONFIG"

          if grep -q "CONFIG_ZSMALLOC" "$CONFIG_FILE"; then
            sed -i 's/CONFIG_ZSMALLOC=m/CONFIG_ZSMALLOC=y/g' "$CONFIG_FILE"
          else
            echo "CONFIG_ZSMALLOC=y" >> "$CONFIG_FILE"
          fi
          sed -i 's/CONFIG_ZRAM=m/CONFIG_ZRAM=y/g' "$CONFIG_FILE"

          # zram / zsmalloc 改为内置后，需要从 GKI 模块列表中移除
          sed -i 's/"drivers\/block\/zram\/zram\.ko",//g; s/"mm\/zsmalloc\.ko",//g' "$KERNEL_ROOT/common/modules.bzl"

          if grep -q "CONFIG_ZSMALLOC=y" "$CONFIG_FILE" && grep -q "CONFIG_ZRAM=y" "$CONFIG_FILE"; then
            cat "$LOCAL_PATCHES/config/zram.config" >> "$CONFIG_FILE"
          fi

      - name: 添加 BBG 防格机补丁
        if: inputs.use_bbg
        working-directory: ${{ env.KERNEL_ROOT }}
        run: |
          wget -O- https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash
          echo "CONFIG_BBG=y" >> common/arch/arm64/configs/gki_defconfig
          sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' common/security/Kconfig

      - name: 配置内核选项
        working-directory: ${{ env.KERNEL_ROOT }}
        env:
          USE_KPM: ${{ inputs.use_kpm }}
        run: |
          cat >> "$DEFCONFIG" << 'EOF'
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_KSU=y
          EOF

          if [ "$USE_KPM" = "true" ]; then
            if ! grep -RqsE '^[[:space:]]*config[[:space:]]+KPM([[:space:]]|$)' common KernelSU 2>/dev/null; then
              echo "错误: 已请求启用 KPM，但当前 SukiSU 代码未声明 CONFIG_KPM" >&2
              exit 1
            fi
            echo "CONFIG_KPM=y" >> "$DEFCONFIG"
          fi

          sed -i 's/check_defconfig//' ./common/build.config.gki

      - name: 添加 SUSFS 配置
        if: inputs.use_susfs
        run: |
          cat >> "$DEFCONFIG" << 'EOF'
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          EOF

      - name: 配置内核名称
        working-directory: ${{ env.KERNEL_ROOT }}
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          sed -i '/^[[:space:]]*"protected_exports_list"[[:space:]]*:[[:space:]]*"android\/abi_gki_protected_exports_aarch64",$/d' ./common/BUILD.bazel
          sed -i '/kmi_symbol_list_strict_mode/d' ./common/BUILD.bazel
          rm -rf ./common/android/abi_gki_protected_exports_*
          sed -i "/stable_scmversion_cmd/s/-maybe-dirty//g" ./build/kernel/kleaf/impl/stamp.bzl

          VERSION_INPUT=$(echo "$VERSION_INPUT" | tr -d '[:space:]')
          if [ -n "$VERSION_INPUT" ]; then
            CLEAN_VERSION=$(echo "$VERSION_INPUT" | sed -E 's/^[0-9]+\.[0-9]+\.[0-9]+//')
            perl -i -0777 -pe 's/(.*)echo "\$\{KERNELVERSION\}\$\{file_localversion\}\$\{config_localversion\}\$\{LOCALVERSION\}\$\{scm_version\}"/$1echo "\$\{KERNELVERSION\}'"${CLEAN_VERSION}"'"/s' ./common/scripts/setlocalversion 2>/dev/null || true
            sed -i "\$s|echo \"\$res\"|echo \"${CLEAN_VERSION}\"|" ./common/scripts/setlocalversion 2>/dev/null || true
            sed -i '/^CONFIG_LOCALVERSION=/ s/="\([^"]*\)"/="'"$CLEAN_VERSION"'"/' ./common/arch/arm64/configs/gki_defconfig
          else
            cd ./common
            BID="ab$((RANDOM % 90000000 + 10000000))"
            GHASH=$(git rev-parse --verify HEAD | cut -c1-13)
            # 伪装成官方 GKI 的版本串：6.1.x-android14-11-g<hash>-ab<id>-4k
            KMI_LOCAL="-android14-11-g${GHASH}-${BID}-4k"
            sed -i "\$s|echo \"\$res\"|echo \"${KMI_LOCAL}\"|" ./scripts/setlocalversion 2>/dev/null || true
            sed -i "/^CONFIG_LOCALVERSION=/ s/=\"[^\"]*\"/=\"${KMI_LOCAL}\"/" ./arch/arm64/configs/gki_defconfig 2>/dev/null || true
          fi

      - name: 设置自定义构建时间
        shell: bash
        env:
          INPUT_TIME: ${{ inputs.build_time }}
        run: |
          set -euo pipefail

          if [[ -n "$INPUT_TIME" && "$INPUT_TIME" != "N" && "$INPUT_TIME" != "n" ]]; then
            TIME_REGEX='^(Mon|Tue|Wed|Thu|Fri|Sat|Sun) (Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec) (0[1-9]|[12][0-9]|3[01]) ([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9] UTC [0-9]{4}$'
            if [[ ! "$INPUT_TIME" =~ $TIME_REGEX ]]; then
              echo "::error title=构建时间格式错误::自定义构建时间必须形如 Sun Dec 01 08:10:00 UTC 2024，请删除多余前缀并使用两位日期。"
              exit 1
            fi

            NORMALIZED_TIME="$(LC_ALL=C TZ=UTC date -u -d "$INPUT_TIME" +'%a %b %d %T UTC %Y' 2>/dev/null || true)"
            if [[ "$NORMALIZED_TIME" != "$INPUT_TIME" ]]; then
              echo "::error title=构建时间无效::自定义构建时间无法解析为真实 UTC 时间，或星期与日期不匹配。"
              exit 1
            fi

            DATESTR="$INPUT_TIME"
          else
            DATESTR="$(TZ='UTC' date +'%a %b %d %T %Z %Y')"
          fi

          echo "使用构建时间: $DATESTR"
          echo "KBUILD_BUILD_TIMESTAMP=$DATESTR" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_VERSION=1" >> "$GITHUB_ENV"

          # 统一处理 mkcompile_h 补丁
          f="$KERNEL_ROOT/common/scripts/mkcompile_h"
          if [ -f "$f" ]; then
            echo "应用 6.x mkcompile_h 补丁: $f"
            if grep -q 'UTS_VERSION=' "$f"; then
              perl -pi -e "s{UTS_VERSION=\"\\\$\\\(.*?\\\)\"}{UTS_VERSION=\"#1 SMP PREEMPT $DATESTR\"}" "$f"
            else
              perl -0777 -pi -e "s{cat <<EOF}{cat <<EOF\n#undef UTS_VERSION\n#define UTS_VERSION \"#1 SMP PREEMPT $DATESTR\" } unless /UTS_VERSION/" "$f"
            fi
          fi

      - name: 编译内核
        id: compile_kernel
        uses: nick-fields/retry@v4
        with:
          shell: bash
          timeout_minutes: 30
          max_attempts: 3
          retry_on: timeout
          command: |
            LOG_DIR="$GITHUB_WORKSPACE/build-logs"
            ATTEMPT_FILE="$LOG_DIR/.compile-attempt"
            mkdir -p "$LOG_DIR"

            # 为 retry 的每次执行生成独立日志
            ATTEMPT=1
            if [ -s "$ATTEMPT_FILE" ]; then
              read -r LAST_ATTEMPT < "$ATTEMPT_FILE"
              if [[ "$LAST_ATTEMPT" =~ ^[0-9]+$ ]]; then
                ATTEMPT=$((LAST_ATTEMPT + 1))
              fi
            fi
            echo "$ATTEMPT" > "$ATTEMPT_FILE"
            LOG_FILE="$LOG_DIR/compile-attempt-${ATTEMPT}.log"

            set -o pipefail
            {
              echo "编译尝试: $ATTEMPT"
              echo "开始时间: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
              echo "当前 KSU 最新提交日期: ${KSU_LATEST_COMMIT_DATE}"
              echo "当前 SUSFS 最新提交日期: ${SUSFS_LATEST_COMMIT_DATE:-未启用}"
              set -ex
              cd "$KERNEL_ROOT"

              sed -i 's/BUILD_SYSTEM_DLKM=1/BUILD_SYSTEM_DLKM=0/' ./common/build.config.gki.aarch64
              sed -i '/MODULES_ORDER=android\/gki_aarch64_modules/d' ./common/build.config.gki.aarch64
              sed -i '/KMI_SYMBOL_LIST_STRICT_MODE/d' ./common/build.config.gki.aarch64

              # 提取 gki_defconfig 修改到 fragment，避免 bazel trim 检查失败
              FRAG="common/arch/arm64/configs/ksu.fragment"
              diff "$DEFCONFIG.orig" "$DEFCONFIG" | grep '^>' | sed 's/^> //; s/^[[:space:]]*//' > "$FRAG" || true
              cp "$DEFCONFIG.orig" "$DEFCONFIG"
              echo "=== KSU Fragment 内容 ==="
              cat "$FRAG"
              echo "========================="
              FRAG_FLAG=""
              if [ -s "$FRAG" ]; then
                FRAG_FLAG="--defconfig_fragment=//common:arch/arm64/configs/ksu.fragment"
              fi
              tools/bazel build --disk_cache=$HOME/.cache/bazel --config=fast $FRAG_FLAG //common:kernel_aarch64/Image || exit 1
              strings ./bazel-bin/common/kernel_aarch64/Image | grep 'Linux version'

              FINAL_CONFIG=$(find ./bazel-bin/common ./out -maxdepth 4 -name '.config' -type f 2>/dev/null | head -n1 || true)
              if [ -n "$FINAL_CONFIG" ]; then
                echo "最终配置: $FINAL_CONFIG"
                grep -E '^CONFIG_LTO' "$FINAL_CONFIG" || echo '（未找到 CONFIG_LTO，可能未启用 LTO 支持）'
                if grep -qx 'CONFIG_LTO_CLANG_THIN=y' "$FINAL_CONFIG"; then
                  echo "::error::Image 使用了 Thin LTO，与官方 GKI 的 LTO_NONE 不一致，刷入后可能无法启动"
                  exit 1
                fi
              else
                echo "::warning::未找到生成的 .config，跳过 LTO 一致性校验"
              fi

              echo "当前 KSU 最新提交日期: ${KSU_LATEST_COMMIT_DATE}"
              echo "当前 SUSFS 最新提交日期: ${SUSFS_LATEST_COMMIT_DATE:-未启用}"
              echo "如果日期不同或相差过远则补丁失效、编译失败"
            } 2>&1 | tee "$LOG_FILE"

            BUILD_STATUS=${PIPESTATUS[0]}
            {
              echo "结束时间: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
              echo "退出码: $BUILD_STATUS"
            } >> "$LOG_FILE"
            exit "$BUILD_STATUS"

      - name: 整理编译失败日志
        if: ${{ always() && steps.compile_kernel.outcome == 'failure' }}
        env:
          COMPILE_ATTEMPTS: ${{ steps.compile_kernel.outputs.total_attempts }}
          COMPILE_EXIT_CODE: ${{ steps.compile_kernel.outputs.exit_code }}
        run: |
          LOG_DIR="$GITHUB_WORKSPACE/build-logs"
          mkdir -p "$LOG_DIR"

          {
            echo "Android 版本: $ANDROID_VERSION"
            echo "内核版本: ${KERNEL_VERSION}.${SUB_LEVEL}"
            echo "安全补丁级别: $OS_PATCH_LEVEL"
            echo "配置名称: ${CONFIG:-未知}"
            echo "Git 提交: $GITHUB_SHA"
            echo "工作流地址: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "编译尝试次数: ${COMPILE_ATTEMPTS:-未知}"
            echo "最终退出码: ${COMPILE_EXIT_CODE:-未知}"
            echo "KSU 提交日期: ${KSU_LATEST_COMMIT_DATE:-未知}"
            echo "SUSFS 提交日期: ${SUSFS_LATEST_COMMIT_DATE:-未知}"
          } > "$LOG_DIR/summary.txt"

          df -h "$GITHUB_WORKSPACE" > "$LOG_DIR/disk-usage.txt" 2>&1 || true
          ccache -s > "$LOG_DIR/ccache-stats.txt" 2>&1 || true

      - name: 上传编译失败日志
        if: ${{ always() && steps.compile_kernel.outcome == 'failure' }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.KSU_VARIANT }}_kernel-${{ env.CONFIG }}-Build-Logs
          path: build-logs/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 9

      - name: 准备 Boot 镜像
        run: |
          mkdir -p bootimgs

          SRC_DIR="$KERNEL_ROOT/bazel-bin/common/kernel_aarch64"

          cp "$SRC_DIR/Image" ./bootimgs/
          cp "$SRC_DIR/Image.lz4" ./bootimgs/
          cp "$SRC_DIR/Image" ./
          cp "$SRC_DIR/Image.lz4" ./
          gzip -n -k -f -9 ./Image > ./Image.gz

      - name: 创建 AnyKernel3 压缩包
        run: |
          cd "$ANYKERNEL3"
          ZIP_NAME="${ANDROID_VERSION}-${KERNEL_VERSION}.${SUB_LEVEL}-${OS_PATCH_LEVEL}-AnyKernel3.zip"
          mv ../Image ./Image
          zip -r "../$ZIP_NAME" ./*

      - name: 构建 Boot 镜像
        working-directory: bootimgs
        run: |
          NAME="${ANDROID_VERSION}-${KERNEL_VERSION}.${SUB_LEVEL}-${OS_PATCH_LEVEL}"
          gzip -n -k -f -9 ./Image > ./Image.gz

          $MKBOOTIMG --header_version 4 --kernel Image --output boot.img
          $AVBTOOL add_hash_footer --partition_name boot --partition_size $((64 * 1024 * 1024)) --image boot.img --algorithm SHA256_RSA2048 --key $BOOT_SIGN_KEY_PATH
          cp ./boot.img "../${NAME}-boot.img"

          $MKBOOTIMG --header_version 4 --kernel Image.gz --output boot-gz.img
          $AVBTOOL add_hash_footer --partition_name boot --partition_size $((64 * 1024 * 1024)) --image boot-gz.img --algorithm SHA256_RSA2048 --key $BOOT_SIGN_KEY_PATH
          cp ./boot-gz.img "../${NAME}-boot-gz.img"

          $MKBOOTIMG --header_version 4 --kernel Image.lz4 --output boot-lz4.img
          $AVBTOOL add_hash_footer --partition_name boot --partition_size $((64 * 1024 * 1024)) --image boot-lz4.img --algorithm SHA256_RSA2048 --key $BOOT_SIGN_KEY_PATH
          cp ./boot-lz4.img "../${NAME}-boot-lz4.img"

      - name: 收集补丁冲突文件
        if: always()
        run: |
          REJECTS_DIR="$GITHUB_WORKSPACE/patch-rejects"
          mkdir -p "$REJECTS_DIR"

          # 跳过上游自带的 .rej：上游分支可能自带已提交的 .rej，
          # 那不是本项目补丁的冲突；
          # patch 失败会覆盖同名文件，所以只跳过「被 git 跟踪且未改动」的
          mapfile -t REJS < <(
            find "$KERNEL_ROOT" -type f -name '*.rej' | sort | while IFS= read -r rej; do
              if git -C "$(dirname "$rej")" ls-files --error-unmatch -- "$(basename "$rej")" >/dev/null 2>&1 \
                && git -C "$(dirname "$rej")" diff --quiet -- "$(basename "$rej")" 2>/dev/null; then
                echo "跳过上游自带的 .rej: ${rej#"$KERNEL_ROOT"/}" >&2
                continue
              fi
              echo "$rej"
            done
          )
          REJ_COUNT=${#REJS[@]}
          echo "发现 $REJ_COUNT 个 .rej 文件"
          echo "REJ_COUNT=$REJ_COUNT" >> $GITHUB_ENV

          if [ "$REJ_COUNT" -gt 0 ]; then
            for REJ in "${REJS[@]}"; do
              REL="${REJ#"$KERNEL_ROOT"/}"
              DEST="$REJECTS_DIR/$REL"
              mkdir -p "$(dirname "$DEST")"
              cp "$REJ" "$DEST"

              ORIG="${REJ%.rej}"
              if [ -f "$ORIG" ]; then
                cp "$ORIG" "${DEST%.rej}"
              fi
              echo "$REL" >> "$REJECTS_DIR/index.txt"
            done
          fi

      - name: 上传构建产物
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.KSU_VARIANT }}_kernel-${{ env.CONFIG }}
          path: |
            *AnyKernel3.zip
            *.img
          retention-days: 14
          compression-level: 9

      - name: 上传补丁冲突文件
        if: always() && env.REJ_COUNT > 0
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.KSU_VARIANT }}_kernel-${{ env.CONFIG }}-Rejects
          path: patch-rejects/
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 9

  release:
    if: ${{ !cancelled() && inputs.release && needs.build.result == 'success' }}
    needs:
      - get-manager
      - build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v8
        with:
          path: ./downloaded-artifacts

      - name: 生成版本标签与发布说明
        env:
          KSU_VER: ${{ needs.get-manager.outputs.ksuVer }}
          SUS_VER: ${{ needs.get-manager.outputs.susVer }}
          KSU_COMMIT: ${{ needs.build.outputs.ksu_commit }}
          SUSFS_REPO: ${{ needs.build.outputs.susfs_repo }}
          SUSFS_COMMIT: ${{ needs.build.outputs.susfs_commit }}
          ACTUAL_SUBLEVEL: ${{ needs.build.outputs.actual_sublevel }}
          USE_SUSFS: ${{ inputs.use_susfs }}
          USE_KPM: ${{ inputs.use_kpm }}
          USE_ZRAM: ${{ inputs.use_zram }}
          USE_BBG: ${{ inputs.use_bbg }}
          USE_CVE: ${{ inputs.cve_2026_43499_patch }}
        run: |
          # get-manager 失败时拿不到版本号，退回用 KernelSU 提交短哈希
          if [ -z "$KSU_VER" ]; then
            KSU_VER="${KSU_COMMIT:0:7}"
            [ -n "$KSU_VER" ] || KSU_VER="unknown"
            echo "::warning::未获取到 SukiSU 版本号，标签使用 $KSU_VER"
          fi

          # 同一个 SukiSU 版本重复构建时，序号递增
          BASE="${KERNEL_VERSION}.${ACTUAL_SUBLEVEL:-$SUB_LEVEL}-${KSU_VER}"
          BASE_RE=$(printf '%s' "$BASE" | sed 's/\./\\./g')
          LAST=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[].tagName' \
            | sed -n "s/^${BASE_RE}-r\([0-9][0-9]*\)\$/\1/p" | sort -n | tail -n 1)
          TAG="${BASE}-r$(( ${LAST:-0} + 1 ))"
          echo "NEW_TAG=$TAG" >> "$GITHUB_ENV"
          echo "生成标签: $TAG"

          onoff() { [ "$1" = "true" ] && echo "开启" || echo "未开启"; }

          if [ "$USE_SUSFS" = "true" ]; then
            SUS_LINE="SUSFS ${SUS_VER}"
            [ -n "$SUSFS_COMMIT" ] && SUS_COMMIT_LINE="- SUSFS4KSU: [\`${SUSFS_COMMIT:0:7}\`](${SUSFS_REPO}/commit/${SUSFS_COMMIT})" \
              || SUS_COMMIT_LINE="- SUSFS4KSU: 未获取到提交信息"
          else
            SUS_LINE="未集成 SUSFS"
            SUS_COMMIT_LINE="- 本次构建未集成 SUSFS"
          fi
          if [ -n "$KSU_COMMIT" ]; then
            KSU_COMMIT_LINE="- SukiSU Ultra: [\`${KSU_COMMIT:0:7}\`](https://github.com/SukiSU-Ultra/SukiSU-Ultra/commit/${KSU_COMMIT})"
          else
            KSU_COMMIT_LINE="- SukiSU Ultra: 未获取到提交信息"
          fi

          echo "RELEASE_NAME=Kernel ${KERNEL_VERSION}.${ACTUAL_SUBLEVEL:-$SUB_LEVEL}: SukiSU ${KSU_VER} + ${SUS_LINE}" >> "$GITHUB_ENV"

          cat > release_body.md << EOF
          ## GKI Kernel ${KERNEL_VERSION}.${ACTUAL_SUBLEVEL:-$SUB_LEVEL} (${ANDROID_VERSION}-${OS_PATCH_LEVEL})

          **SukiSU Ultra ${KSU_VER}** + **${SUS_LINE}**

          ### 构建配置

          | 项目 | 内容 |
          |:---|:---|
          | 内核 | ${ANDROID_VERSION}-${KERNEL_VERSION}.${ACTUAL_SUBLEVEL:-$SUB_LEVEL}（${OS_PATCH_LEVEL}） |
          | SUSFS | $(onoff "$USE_SUSFS") |
          | KPM | $(onoff "$USE_KPM") |
          | ZRAM / LZ4KD | $(onoff "$USE_ZRAM") |
          | BBG 防格机 | $(onoff "$USE_BBG") |
          | CVE-2026-43499 修复 | $(onoff "$USE_CVE") |

          ### 下载说明

          | 文件 | 用途 |
          |:---|:---|
          | \`*-AnyKernel3.zip\` | AnyKernel3 内核刷入包 |
          | \`*-boot*.img\` | 已签名的 boot 镜像（raw / gz / lz4） |
          | \`*.apk\` | SukiSU 管理器 |
          | SUSFS 模块 \`.zip\` | SUSFS 配套模块 |

          > [!IMPORTANT]
          > 刷入前请备份原厂 Boot 镜像，并确认设备当前内核为 \`${KERNEL_VERSION}.x-${ANDROID_VERSION}\`。
          > 如果设备无法启动，请先恢复原厂镜像。

          <details>
          <summary>上游提交信息</summary>

          ${KSU_COMMIT_LINE}

          ${SUS_COMMIT_LINE}

          </details>
          EOF

      - name: 创建 GitHub Release
        run: |
          # 内核产物 + 管理器 + SUSFS 模块；跳过冲突文件和日志产物
          mapfile -d '' FILES < <(find ./downloaded-artifacts -type f \
            \( -name '*AnyKernel3.zip' -o -name '*.img' -o -name '*.apk' -o -path './downloaded-artifacts/susfs-*/*' \) \
            ! -path '*-Rejects/*' ! -path '*-Build-Logs/*' -print0)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "::error::没有找到可上传的产物"
            exit 1
          fi
          printf '上传: %s\n' "${FILES[@]}"

          gh release create "$NEW_TAG" "${FILES[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_NAME" \
            --notes-file release_body.md \
            --target "$GITHUB_SHA"

      - name: 构建摘要
        run: |
          echo "## 发布已创建" >> $GITHUB_STEP_SUMMARY
          echo "- **标签**: $NEW_TAG" >> $GITHUB_STEP_SUMMARY
          echo "- **链接**: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$NEW_TAG" >> $GITHUB_STEP_SUMMARY
